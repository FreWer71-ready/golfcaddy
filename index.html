<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#064e3b"><title>Fredriks Golfcaddy 1.2.5</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17221c;background:#062d25}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#064e3b,#071b20);min-height:100vh}.app{max-width:430px;margin:auto;background:#f4f7f1;min-height:100vh}.head{padding:calc(22px + env(safe-area-inset-top)) 20px 18px;background:#065f46;color:white}.eyebrow{font-size:11px;letter-spacing:.18em;color:#a7f3d0}.head h1{margin:5px 0 14px}.stats,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#ffffff18;border-radius:14px;padding:9px;text-align:center;font-size:12px}.stat b{display:block;font-size:15px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);padding:12px;gap:6px;position:sticky;top:0;background:#f4f7f1;z-index:2}.tabs button,.button{border:0;border-radius:14px;padding:11px;background:#d1fae5;font-weight:700}.tabs button.active,.button.primary{background:#047857;color:white}.view{padding:0 14px 90px}.card{background:white;border-radius:22px;padding:16px;margin:10px 0;box-shadow:0 2px 10px #0000000a}.hero{background:linear-gradient(135deg,#d9f99d,#34d399);position:relative;overflow:hidden}.hero h2{font-size:46px;margin:0;color:#064e3b}.badges{position:absolute;right:14px;top:14px}.badge{background:#064e3b;color:white;padding:6px 9px;border-radius:12px;font-size:12px;margin-left:4px}.distance{font-size:24px;font-weight:800}.sketch svg{width:100%;height:auto}.legend{font-size:11px;color:#52615a}.advice{background:#052e2b;color:white}.advice small{color:#6ee7b7;letter-spacing:.12em}.advice h3{font-size:23px;margin:4px 0 12px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.stepper button{width:40px;height:40px;border-radius:50%;border:1px solid #ddd;background:white;font-size:22px}.score{font-size:58px;font-weight:800;color:#047857}.holes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.holebtn{border:0;border-radius:9px;padding:7px 2px;background:#ecfdf5}.holebtn.active{background:#047857;color:white}.metric{background:white;border-radius:16px;padding:13px}.metric b{display:block;font-size:22px;color:#065f46}.nav{display:flex;justify-content:space-between}.note{font-size:11px;color:#647067}.official{display:block;text-align:center;text-decoration:none;background:#047857;color:white;border-radius:14px;padding:11px;font-weight:700;margin-top:10px}.historygrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:10px}.historygrid div{padding:8px 2px;border-radius:10px;background:#ecfdf5;text-align:center;font-size:10px}.historygrid b{display:block;font-size:16px;color:#065f46}.hide{display:none}</style><link rel="manifest" href="manifest.webmanifest?v=1.2.5"><link rel="apple-touch-icon" href="icons/icon-180.png?v=1.2.5"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Golfcaddy"></head><body><div class="app"><header class="head"><div class="eyebrow">FREDRIKS GOLFCADDY · VERSION 1.2.5</div><h1>Torshälla GK</h1><div class="stats"><div class="stat">HCP<b>33,3</b></div><div class="stat">Torshälla<b>30 ronder</b></div><div class="stat">Bäst<b>45 p</b></div></div></header><div class="tabs"><button data-tab="caddy" class="active">Caddy</button><button data-tab="profile">Min statistik</button></div><main class="view"><div id="pwa-status" class="card" style="display:none;font-size:12px"></div><section id="caddy"></section><section id="profile" class="hide"></section></main></div><script>
const P={hcp:33.3,rounds:37,torshallaRounds:30,avgPoints:35.1,torshallaAvg:35.2,bestPoints:45,fairway:46,gir:5,putts:40.3,missRight:28,missShort:32,hcpImprovement:10.7};
const H=[[4,10,347],[4,6,356],[4,2,378],[3,18,113],[5,4,491],[5,12,480],[4,8,331],[3,16,140],[4,14,304],[4,9,335],[5,13,497],[3,11,166],[4,5,326],[4,3,347],[3,17,114],[4,1,379],[4,7,363],[5,15,435]].map((x,i)=>({hole:i+1,par:x[0],index:x[1],distance:x[2]}));
const HS={birdie:1,par:14,bogey:68,double:76,worse:93,putt3:2.0,putt45:2.25};
const C=[['Driver 909 D-Comp',145,181],['Järn 5 King F9',115,144],['Järn 8 King F9',113,124],['Järn 7 King F9',109,126],['Järn 9 King F9',101,108],['Pitching Wedge',90,93],['Wedge 60°',72,84]];
let i=+(localStorage.gcHole||0), wind=0; let scores = {};
try { scores = JSON.parse(localStorage.gcScores || '{}'); } catch(e) { console.warn('Failed to parse gcScores, resetting:', e); scores = {}; }
function club(d){if(d>168)return C[0];return C.reduce((a,b)=>Math.abs(b[1]-d)<Math.abs(a[1]-d)?b:a)}
function advice(h){if(h.par===3)return `Din vanligaste greenmiss är kort (${P.missShort} %) och höger (${P.missRight} %). Sikta vänster om centrum och välj klubba efter carry. ${club(h.distance)[0]} ligger närmast i din uppmätta bag.`;if(h.par===5)return 'Spela hålet som tre kontrollerade transportslag. Din driver har 145 m carry och 181 m total i rangesnitt. Lämna ett tredje slag kring 90–110 m.';if(h.index<=6)return 'Ett av banans svårare hål. Spela för en säker väg fram, sikta vänster om mållinjen och prioritera ett bekvämt närspel.';return 'Fairwayträff ger klart bättre resultat i ditt underlag. Välj en konservativ startlinje, acceptera ett extra slag fram och undvik flaggjakt.'}
function sketch(h){const tag='?v=1.2.5';const src = `assets/holes/hole${h.hole}.jpg${tag}`;return `<div class="card sketch"><b>Hålskiss · hål ${h.hole}</b><img src="${src}" alt="Hål ${h.hole}" style="width:100%;height:auto;border-radius:12px" onerror="this.src='assets/banguide.jpg?v=1.2.5'"/><div class="legend">Officiell hålskiss från Torshälla GK. Klicka nedan för detaljerad banguide.</div><a class="official" href="https://torshallagk.se/spela/banan/" target="_blank" rel="noopener noreferrer">Öppna Torshälla GK:s officiella banguide</a></div>`}
function render(){let h=H[i],eff=Math.max(1,h.distance+wind*2),s=scores[h.hole]??h.par;document.querySelector('#caddy').innerHTML=`<div class="card hero"><div class="badges"><span class="badge">Par ${h.par}</span><span class="badge">Index ${h.index}</span></div><small>HÅL</small><h2>${h.hole}</h2><div>Tee 2</div><div class="distance">${h.distance} m</div></div>${sketch(h)}<div class="card"><small style="color:#047857;font-weight:800">PERSONLIG HÅLSTATISTIK</small><h3 style="margin:5px 0">Underlag för hål ${h.hole}</h3><div class="legend">Resultatsammanfattningen omfattar 19 ronder och redovisar samlade hålutfall, inte specifika hålnummer.</div><div class="grid" style="margin-top:10px"><div class="metric">Puttar/hål<b>${h.par===3?HS.putt3:HS.putt45}</b></div><div class="metric">Fairway<b>${h.par===3?'Ej tillämpligt':'46 %'}</b></div><div class="metric">GIR<b>5 %</b></div></div><div class="historygrid"><div>Birdie<b>${HS.birdie}</b></div><div>Par<b>${HS.par}</b></div><div>Bogey<b>${HS.bogey}</b></div><div>Dubbel<b>${HS.double}</b></div><div>Sämre<b>${HS.worse}</b></div></div></div><div class="card row"><b>Vindjustering</b><div class="stepper"><button onclick="wind--;render()">−</button> <b>${wind>0?'+':''}${wind} m/s</b> <button onclick="wind++;render()">+</button></div></div><div class="card advice"><small>PERSONLIGT RÅD</small><h3>${h.par===3?club(eff)[0]:'Spela för position'}</h3><div>${advice(h)}</div><p class="note">Klubbdistanserna är rangevärden från matta och rangebollar.</p></div><div class="nav"><button class="button" onclick="move(-1)" ${i===0?'disabled':''}>‹ Föregående</button><button class="button primary" onclick="move(1)" ${i===17?'disabled':''}>Nästa ›</button></div>`;
/* Score tab removed */
document.querySelector('#profile').innerHTML=`<div class="card advice"><small>PERSONLIG NULÄGESBILD</small><h3>Fredrik, HCP ${P.hcp}</h3><div class="score" style="color:#bef264">−${P.hcpImprovement}</div><div>HCP sedan första registrerade rond</div></div><div class="grid">${[['Snittpoäng',P.avgPoints],['Torshälla',P.torshallaAvg],['Fairway',P.fairway+' %'],['Greenträff',P.gir+' %'],['Puttar/rond',P.putts],['Ronder',P.rounds]].map(x=>`<div class="metric">${x[0]}<b>${x[1]}</b></div>`).join('')}</div><div class="card" id="hole-stats"><small>Hålscorer</small><div id="hole-scores-list">Laddar…</div></div><div class="card"><b>Caddyns fokus</b><p>• Välj mer klubba. 32 % av greenmissarna är korta.</p><p>• Sikta vänster om centrum. 28 % av greenmissarna är höger.</p><p>• Prioritera fairway och träna lagputtning.</p></div>`;fetch('assets/data/hole_scores.json?v=1.2.5').then(r=>r.json()).then(data=>{let list=Object.keys(data).sort((a,b)=>a-b).map(h=>`<div class="metric">Hål ${h}<b>${data[h].join(', ')}</b></div>`).join('');document.getElementById('hole-scores-list').innerHTML=`<div class="grid">${list}</div>`}).catch(e=>{document.getElementById('hole-scores-list').textContent='Ingen data'})
function move(d){i=Math.max(0,Math.min(17,i+d));localStorage.gcHole=i;render()}function go(n){i=n;localStorage.gcHole=i;render()}function setScore(n){scores[H[i].hole]=Math.max(1,n);localStorage.gcScores=JSON.stringify(scores);render()}
try{document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');['caddy','profile'].forEach(x=>document.querySelector('#'+x).classList.toggle('hide',x!==b.dataset.tab))});render();}catch(e){console.error('Render failed:',e);const c=document.getElementById('caddy');if(c) c.innerHTML='<div class="card"><b>Fel i UI</b><p>Se konsolen för fel (F12) eller kontakta utvecklaren.</p></div>';}
</script><script>
let deferredPrompt;
const statusBox=document.getElementById('pwa-status');
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredPrompt=event;statusBox.style.display='block';statusBox.innerHTML='<b>Golfcaddy 1.2 kan installeras</b><br><button id="install-app" class="button primary" style="margin-top:8px">Installera appen</button>';document.getElementById('install-app').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;statusBox.style.display='none';};});
window.addEventListener('appinstalled',()=>{statusBox.style.display='block';statusBox.textContent='Golfcaddy är installerad.';});
window.addEventListener('offline',()=>{statusBox.style.display='block';statusBox.textContent='Offline-läge: appen använder sparat innehåll.';});
window.addEventListener('online',()=>{if(!deferredPrompt)statusBox.style.display='none';});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));}
</script></body></html>
